name: Bot PJe TJMA

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      forcar_fora_da_janela:
        description: "Rodar mesmo fora da janela 8h-18h (só para testes manuais)"
        type: boolean
        default: false

concurrency:
  group: bot-pje-tjma
  cancel-in-progress: false

jobs:
  rodar-bot:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 350

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
        shell: powershell

      - name: Criar arquivos de credenciais do Firebase (principal + failovers)
        run: |
          Set-Content -Path firebase-service-account.json -Value $env:FIREBASE_SERVICE_ACCOUNT_JSON -NoNewline -Encoding ascii
          Set-Content -Path firebase-service-account-failover.json -Value $env:FIREBASE_SERVICE_ACCOUNT_FAILOVER_JSON -NoNewline -Encoding ascii
          Set-Content -Path firebase-service-account-failover2.json -Value $env:FIREBASE_SERVICE_ACCOUNT_FAILOVER2_JSON -NoNewline -Encoding ascii
          Set-Content -Path firebase-service-account-failover3.json -Value $env:FIREBASE_SERVICE_ACCOUNT_FAILOVER3_JSON -NoNewline -Encoding ascii
        shell: powershell
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_FAILOVER_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER_JSON }}
          FIREBASE_SERVICE_ACCOUNT_FAILOVER2_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER2_JSON }}
          FIREBASE_SERVICE_ACCOUNT_FAILOVER3_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAILOVER3_JSON }}
          # status_bots.py reaproveita esse mesmo firebase-service-account.json
          # (projeto principal) pras coleções bots_status/bots_heartbeat —
          # não precisa de um secret separado.

      - name: Criar arquivo .env
        run: |
          "PJE_USUARIO=$env:PJE_USUARIO" | Out-File -FilePath .env -Encoding ascii
          "PJE_SENHA_TJMA=$env:PJE_SENHA_TJMA" | Add-Content -Path .env
          "PJE_SENHA_TJPI=$env:PJE_SENHA_TJPI" | Add-Content -Path .env
          "PJE_SENHA_TJRN=$env:PJE_SENHA_TJRN" | Add-Content -Path .env
          "PJE_TOTP_SECRET=$env:PJE_TOTP_SECRET" | Add-Content -Path .env
        shell: powershell
        env:
          PJE_USUARIO: ${{ secrets.PJE_USUARIO }}
          PJE_SENHA_TJMA: ${{ secrets.PJE_SENHA_TJMA }}
          PJE_SENHA_TJPI: ${{ secrets.PJE_SENHA_TJPI }}
          PJE_SENHA_TJRN: ${{ secrets.PJE_SENHA_TJRN }}
          PJE_TOTP_SECRET: ${{ secrets.PJE_TOTP_SECRET }}

      - name: Rodar bot
        run: python -u bot_pje_ma.py
        shell: powershell
        env:
          PYTHONUNBUFFERED: "1"
          FORCAR_FORA_DA_JANELA: ${{ github.event.inputs.forcar_fora_da_janela || 'false' }}
        # O bot roda em loop infinito (varredura a cada 30s). Ele fica
        # em primeiro plano aqui até o timeout-minutes do job (acima)
        # derrubar o runner — é esperado o step terminar por timeout,
        # não por erro. O cron dispara uma nova execução em seguida.
        # HEADLESS já é True no script, então não precisa de tela virtual.

      - name: Publicar screenshots de diagnóstico (debug_login)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: debug-login-${{ github.run_id }}
          path: debug_login/
          if-no-files-found: ignore
          retention-days: 7
