name: Bot PJe TJMA

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bot-pje-tjma
  cancel-in-progress: false

jobs:
  rodar-bot:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 350

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
        shell: pwsh

      - name: Criar arquivo de credenciais do Firebase
        run: Set-Content -Path firebase-service-account.json -Value $env:FIREBASE_SERVICE_ACCOUNT -NoNewline
        shell: pwsh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Criar arquivo .env
        run: |
          "PJE_USUARIO=$env:PJE_USUARIO" | Out-File -FilePath .env -Encoding utf8NoBOM
          "PJE_SENHA_TJMA=$env:PJE_SENHA_TJMA" | Add-Content -Path .env
          "PJE_TOTP_SECRET=$env:PJE_TOTP_SECRET" | Add-Content -Path .env
        shell: pwsh
        env:
          PJE_USUARIO: ${{ secrets.PJE_USUARIO }}
          PJE_SENHA_TJMA: ${{ secrets.PJE_SENHA_TJMA }}
          PJE_TOTP_SECRET: ${{ secrets.PJE_TOTP_SECRET }}

      - name: Rodar bot
        run: python -u bot_pje_ma.py
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
        # O bot roda em loop infinito (varredura a cada 30s). Ele fica
        # em primeiro plano aqui até o timeout-minutes do job (acima)
        # derrubar o runner — é esperado o step terminar por timeout,
        # não por erro. O cron dispara uma nova execução em seguida.
        # HEADLESS já é True no script, então não precisa de tela virtual.
